<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    .auth-container {
      margin: 1em;
    }
    input {
      width: 100%;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <label for="api-token">Klucz API Toggl Track:</label>
    <input type="password" id="api-token" placeholder="Token API Toggl">
    <button id="save-btn" class="mod-primary">Zapisz</button>
  </div>

  <script>
    console.log('Strona auth.html została załadowana!');
    var t = window.TrelloPowerUp.iframe();
    
    // Sprawdź, czy jest już zapisany token
    t.get('member', 'private', 'togglApiToken')
      .then(function(token) {
        if (token) {
          document.getElementById('api-token').value = token;
        }
      });
    
    // Zapisz token po kliknięciu przycisku
    document.getElementById('save-btn').addEventListener('click', function() {
      var token = document.getElementById('api-token').value;
      if (token) {
        t.set('member', 'private', 'togglApiToken', token)
          .then(function() {
            t.closePopup();
          });
      }
    });
  </script>
</body>
</html>
